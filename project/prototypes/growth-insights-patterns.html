<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Growth Insights Patterns</title>
<!--
  PROTOTYPE ONLY (Han, 2026-10-24): three linear micro-visualizations inside the V2 Key Insight tile
  (Figma 203:5442, Grow screen 203:5215). Demo data, not wired to the app, the Grow engine or Supabase.
  Remove the whole project/prototypes/ folder to delete it.
-->
<link rel="stylesheet" href="../_ds/learning-app-design-system-e32a09db-3d6a-49a3-8d8c-ead805c40fc1/tokens/fonts.css">
<link rel="stylesheet" href="../_ds/learning-app-design-system-e32a09db-3d6a-49a3-8d8c-ead805c40fc1/tokens/colors.css">
<link rel="stylesheet" href="../_ds/learning-app-design-system-e32a09db-3d6a-49a3-8d8c-ead805c40fc1/tokens/typography.css">
<link rel="stylesheet" href="../_ds/learning-app-design-system-e32a09db-3d6a-49a3-8d8c-ead805c40fc1/tokens/spacing.css">
<link rel="stylesheet" href="../_ds/learning-app-design-system-e32a09db-3d6a-49a3-8d8c-ead805c40fc1/tokens/effects.css">
<link rel="stylesheet" href="../_ds/learning-app-design-system-e32a09db-3d6a-49a3-8d8c-ead805c40fc1/tokens/v2.css">
<link rel="stylesheet" href="../_ds/learning-app-design-system-e32a09db-3d6a-49a3-8d8c-ead805c40fc1/components-v2.css">
<style>
  /* Prototype-local values. Tile, type and dot come from the DS KeyInsight (.rw-key, Figma 203:5442).
     Every colour is an existing V2 token. */
  :root{
    --gi-mark-h: 20px;                                      /* every graphic: one 20px mark row ... */
    --gi-gap: 8px;                                          /* ... then 8px ... */
    --gi-label-h: 12px;                                     /* ... then one 12px label row (Micro labels on) */
    --gi-thick: 8px;                                        /* bar and segment thickness = Figma Simple bar */
    --gi-dot: 8px;                                          /* end marker, same size as the bar is thick */
    --gi-track: var(--rw-color-data-track);                 /* PurpleGrey 500: every unfilled part */
    --gi-fill: linear-gradient(270deg, var(--rw-blue-gradient-01-stops)); /* Blue Gradient 01, bright end = latest */
    --gi-marker: var(--rw-b75);                             /* B75: the latest value's dot (Me avatar colour) */
    --gi-marker-label: var(--rw-win);                       /* B100: the latest value's number */
    --gi-attention: var(--rw-loss);                         /* O100: the W/L loss colour, for recurring problems */
    --gi-earlier: var(--rw-gap-zero);                       /* N300: the score-gap zero line colour, for "before" */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--rw-bg-app);color:var(--rw-text-primary);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
  .page{min-height:100vh;display:flex;justify-content:center;}
  .phone{width:100%;max-width:390px;padding:24px 20px 48px;display:flex;flex-direction:column;gap:20px;}
  .head{display:flex;flex-direction:column;gap:8px;}
  .head h1{font:var(--rw-type-appbar-title);letter-spacing:var(--rw-tracking);margin:0;}
  .demo{display:flex;align-items:center;gap:8px;font:var(--rw-type-caption);letter-spacing:var(--rw-tracking);color:var(--rw-text-secondary);}
  .demo i{width:6px;height:6px;border-radius:50%;background:var(--gi-attention);flex-shrink:0;}
  .opts{display:flex;flex-wrap:wrap;gap:8px;}
  .opts .rw-pill{background:var(--rw-surface-fill);}
  .stack{display:flex;flex-direction:column;gap:16px;}
  .label{font:var(--rw-type-caption);letter-spacing:var(--rw-tracking);color:var(--rw-chart-label-fg);margin:4px 0 -8px;}

  /* Shared geometry for all three graphics:
     full content width (left edge = text edge, right edge = tile padding), one 20px mark row, 8px gap,
     one 12px label row. Marks are centred in the mark row. A mark's end point sits 4px in from its outer
     edge (the round cap), so every outer edge lands exactly on 0 and 100%. */
  .gi-graphic{width:100%;display:flex;flex-direction:column;gap:var(--gi-gap);}
  .gi-marks{position:relative;height:var(--gi-mark-h);display:flex;align-items:center;}
  .gi-labels{position:relative;height:var(--gi-label-h);font:var(--rw-type-row-sub);letter-spacing:var(--rw-tracking);color:var(--rw-chart-label-fg);}
  .gi-labels span{position:absolute;top:0;line-height:var(--gi-label-h);white-space:nowrap;}
  .gi-labels .is-start{left:0;}
  .gi-labels .is-end{right:0;}
  .gi-labels .is-at{transform:translateX(-50%);font-variant-numeric:tabular-nums;}
  .gi-labels .is-latest{color:var(--gi-marker-label);}
  .gi-dot{position:absolute;top:50%;width:var(--gi-dot);height:var(--gi-dot);margin:calc(var(--gi-dot) / -2) 0 0 calc(var(--gi-dot) / -2);border-radius:50%;background:var(--gi-marker);}

  /* A. Trend Line: 6 points, 2px line using the whole 20px row, the latest point marked */
  .gi-spark{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}

  /* B. Comparison Lines: one 8px track, earlier and recent bars on top of each other (shorter one in front) */
  .gi-cmp{position:relative;width:100%;height:var(--gi-thick);border-radius:99px;background:var(--gi-track);}
  .gi-cmp>div{position:absolute;left:0;top:0;bottom:0;border-radius:99px;}
  .gi-cmp .is-earlier{background:var(--gi-earlier);}
  .gi-cmp .is-recent{background:var(--gi-fill);}

  /* C. Match Strip: one 8px segment per match, 4px apart, oldest left */
  .gi-strip{width:100%;display:flex;gap:4px;height:var(--gi-thick);}
  .gi-strip>div{flex:1;border-radius:99px;background:var(--gi-track);}
  .gi-strip>div.is-on{background:var(--gi-attention);}

  .note{display:flex;flex-direction:column;gap:6px;font:var(--rw-type-meta);letter-spacing:var(--rw-tracking);color:var(--rw-text-secondary);}
  .note b{font-weight:600;color:var(--rw-text-primary);}
</style>
</head>
<body>
<div class="page rw-scroll is-v2"><div class="phone">
  <div class="head">
    <h1 id="h-title"></h1>
    <div class="demo"><i></i><span id="h-demo"></span></div>
  </div>

  <div class="rw-surface rw-tabs is-sm" role="tablist" id="tabs"></div>
  <div class="opts" id="opts"></div>

  <div class="stack" id="stack"></div>

  <div class="rw-surface rw-tile note" id="note"></div>
</div></div>

<script>
// Demo data only. Not real player analytics.
const DEMO = {
  trend: [42, 47, 45, 53, 58, 64],          // net points won %, oldest -> latest
  compare: { earlier: 7, recent: 3 },        // defensive mistakes reported, previous 3 vs last 3 matches
  strip: [1, 0, 1, 1, 0, 1]                  // serve errors mentioned per match, oldest -> latest
};

const T = {
  en: {
    title: 'Growth Insights Pattern Preview', demo: 'Demo data. Sample values, not real player analytics.',
    eyebrow: 'Key insight', tabs: { trend: 'Trend', compare: 'Compare', strip: 'Strip' },
    all: 'Show all three', labels: 'Micro labels', lang: '中文',
    names: { trend: 'A · Trend Line', compare: 'B · Comparison Lines', strip: 'C · Match Strip' },
    trend: { t: 'Your net game is getting stronger.', b: 'Your net play has improved across recent matches.' },
    compare: { t: 'Your defence is improving.', b: 'You reported fewer defensive mistakes in your last 3 matches compared with the previous 3.', k1: 'Previous 3', k2: 'Last 3' },
    strip: { t: 'Serve errors keep showing up.', b: 'You mentioned serve errors in 4 of your last 6 matches.' },
    ends: ['6 matches ago', 'Latest'],
    notes: {
      trend: '<b>Trend Line</b> for performance over time: one skill measured match by match (here, share of net points won across 6 matches). Bright end = latest match.',
      compare: '<b>Comparison Lines</b> for before vs. after or A vs. B: two totals on one track (here, defensive mistakes reported in the previous 3 vs. last 3 matches). Grey = earlier, blue = recent, the dot marks the latest value.',
      strip: '<b>Match Strip</b> for frequency or consistency: one segment per match, lit when the thing happened (here, serve errors mentioned in 4 of 6). Oldest left, latest right.'
    }
  },
  zh: {
    title: '成长洞察图形预览', demo: '演示数据，仅为示例数值，并非真实球员分析。',
    eyebrow: '关键洞察', tabs: { trend: '趋势线', compare: '对比线', strip: '比赛条' },
    all: '同时显示三个', labels: '小标签', lang: 'English',
    names: { trend: 'A · 趋势线', compare: 'B · 对比线', strip: 'C · 比赛条' },
    trend: { t: '你的网前越来越强了。', b: '最近几场比赛里，你的网前表现持续进步。' },
    compare: { t: '你的防守在进步。', b: '和之前 3 场相比，你在最近 3 场比赛中记录的防守失误更少。', k1: '之前 3 场', k2: '最近 3 场' },
    strip: { t: '发球失误反复出现。', b: '你在最近 6 场比赛中有 4 场提到了发球失误。' },
    ends: ['6 场前', '最近'],
    notes: {
      trend: '<b>趋势线</b>：表现随时间的变化。同一项技术逐场衡量（示例：6 场比赛中网前得分占比）。亮的一端是最近一场。',
      compare: '<b>对比线</b>：前后对比或 A/B 对比。两组总数叠在同一条轨道上（示例：之前 3 场和最近 3 场记录的防守失误）。灰色是之前，蓝色是最近，圆点标出最新数值。',
      strip: '<b>比赛条</b>：频率或稳定性。每场比赛一段，发生过就点亮（示例：6 场中 4 场提到发球失误）。左边最早，右边最近。'
    }
  }
};

const qs = new URLSearchParams(location.search);
const S = {
  pattern: ['trend', 'compare', 'strip'].includes(qs.get('p')) ? qs.get('p') : 'trend',
  all: qs.get('all') === '1',
  labels: qs.get('labels') !== '0',
  lang: qs.get('lang') === 'zh' || (!qs.get('lang') && /^zh/i.test(navigator.language)) ? 'zh' : 'en'
};

const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

function sparkline(values) {
  // Drawn in a box inset 4px (the dot radius) at the top, right and bottom and 1px (the round cap) at the left,
  // so the line's first cap and the end dot's outer edge land exactly on 0 and 100%, like the bars. Stretched to the box; the stroke stays 2px. No axes.
  const min = Math.min(...values), max = Math.max(...values);
  const pts = values.map((v, i) => [i * 100 / (values.length - 1), 100 - (v - min) / ((max - min) || 1) * 100]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' ');
  const [lx, ly] = pts[pts.length - 1];
  const id = 'gi-grad-' + Math.random().toString(36).slice(2, 7);
  return `<div style="position:absolute;inset:4px 4px 4px 1px;">
    <svg class="gi-spark" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs><!-- Blue Gradient 01 stops (--rw-blue-gradient-01-stops), reversed so the latest match is bright --><linearGradient id="${id}" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#2c3f5c"/><stop offset="1" stop-color="#5b9dff"/></linearGradient></defs>
      <path d="${d}" fill="none" stroke="url(#${id})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="gi-dot" style="left:${lx}%;top:${ly}%;"></div>
  </div>`;
}

function graphic(kind, tx) {
  const g = el('div', 'gi-graphic');
  const ends = `<div class="gi-labels"><span class="is-start">${tx.ends[0]}</span><span class="is-end">${tx.ends[1]}</span></div>`;
  let marks = '', labels = ends;
  if (kind === 'trend') marks = sparkline(DEMO.trend);
  if (kind === 'compare') {
    // Same scale rule as the Simple bar: the larger value fills 80% of the track.
    const { earlier, recent } = DEMO.compare, scale = Math.max(earlier, recent) * 1.25;
    const w = v => (v / scale * 100).toFixed(1) + '%', at = v => `calc(${w(v)} - var(--gi-dot) / 2)`;
    const bars = [['is-earlier', earlier], ['is-recent', recent]].sort((x, y) => y[1] - x[1]);
    marks = `<div class="gi-cmp">${bars.map(([c, v]) => `<div class="${c}" style="width:${w(v)}"></div>`).join('')}<div class="gi-dot" style="left:${at(recent)}"></div></div>`;
    labels = `<div class="gi-labels"><span class="is-at" style="left:${at(earlier)}">${earlier}</span><span class="is-at is-latest" style="left:${at(recent)}">${recent}</span></div>`;
  }
  if (kind === 'strip') marks = `<div class="gi-strip">${DEMO.strip.map(on => `<div class="${on ? 'is-on' : ''}"></div>`).join('')}</div>`;
  g.innerHTML = `<div class="gi-marks">${marks}</div>` + (S.labels ? labels : '');
  return g;
}

function tile(kind, tx) {
  // DS KeyInsight (.rw-key, Figma 203:5442); only the graphic differs.
  const t = el('div', 'rw-surface rw-tile rw-key');
  t.setAttribute('data-pattern', kind);
  t.appendChild(el('div', 'rw-key-head', `<span class="rw-label">${tx.eyebrow}</span>`));
  t.appendChild(el('p', 'rw-key-title', tx[kind].t));
  t.appendChild(el('p', 'rw-key-body', tx[kind].b));
  t.appendChild(graphic(kind, tx));
  return t;
}

function render() {
  const tx = T[S.lang];
  document.documentElement.lang = S.lang === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('h-title').textContent = tx.title;
  document.getElementById('h-demo').textContent = tx.demo;

  const tabs = document.getElementById('tabs'); tabs.innerHTML = '';
  ['trend', 'compare', 'strip'].forEach(k => {
    const on = !S.all && S.pattern === k, b = el('button', 'rw-tab' + (on ? ' is-active' : ''), tx.tabs[k]);
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', on);
    b.onclick = () => { S.pattern = k; S.all = false; sync(); };
    tabs.appendChild(b);
  });

  const opts = document.getElementById('opts'); opts.innerHTML = '';
  [[tx.all, S.all, () => S.all = !S.all], [tx.labels, S.labels, () => S.labels = !S.labels], [tx.lang, false, () => S.lang = S.lang === 'zh' ? 'en' : 'zh']].forEach(([label, on, fn]) => {
    const b = el('button', 'rw-pill rw-pill-sm' + (on ? ' is-active' : ''), label);
    b.setAttribute('aria-pressed', on); b.onclick = () => { fn(); sync(); };
    opts.appendChild(b);
  });

  const stack = document.getElementById('stack'); stack.innerHTML = '';
  (S.all ? ['trend', 'compare', 'strip'] : [S.pattern]).forEach(k => {
    if (S.all) stack.appendChild(el('div', 'label', tx.names[k]));
    stack.appendChild(tile(k, tx));
  });

  document.getElementById('note').innerHTML = (S.all ? ['trend', 'compare', 'strip'] : [S.pattern]).map(k => `<div>${tx.notes[k]}</div>`).join('');
}

function sync() {
  const q = new URLSearchParams();
  q.set('p', S.pattern); if (S.all) q.set('all', '1'); if (!S.labels) q.set('labels', '0'); q.set('lang', S.lang);
  history.replaceState(null, '', '?' + q.toString());
  render();
}
render();
</script>
</body>
</html>
